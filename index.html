const ALL=RAW.split("\n").map(l=>{const[n,e,v]=l.split("|");return{n:+n,e,v}});
let st={};try{st=JSON.parse(localStorage.getItem("fc4")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("fc4",JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
let deck=[],i=0,flip=false;
const maxN=ALL[ALL.length-1].n;
$("grp").innerHTML='<option value="0">Câu 1–'+maxN+'</option>'+Array.from({length:Math.ceil(maxN/50)},(_,k)=>`<option value="${k+1}">Câu ${k*50+1}–${Math.min(maxN,k*50+50)}</option>`).join("");
function build(shuffle){
  const g=+$("grp").value,todo=$("mode").value==="todo";
  deck=ALL.filter(c=>(!g||(c.n>(g-1)*50&&c.n<=g*50))&&(!todo||!st[c.n]));
  if(shuffle)deck.sort(()=>Math.random()-.5);
  i=0;flip=false;draw();
}
function draw(){
  const c=deck[i];
  if(!c){$("card").innerHTML='<div class="vi">Không còn thẻ nào. Đổi nhóm hoặc chế độ.</div>';$("pos").textContent="0/0"}
  else{
    $("card").innerHTML=flip?`<div class="num">Câu ${c.n}</div><div class="vi">${c.v}</div><div class="hint">${c.e}</div>`:`<div class="num">Câu ${c.n}</div><div class="en">${c.e}</div><div class="hint">Chạm để xem nghĩa</div>`;
    $("card").style.setProperty("--h",(c.n*47)%360);
    $("pos").textContent=(i+1)+"/"+deck.length;
  }
  const k=ALL.filter(x=>st[x.n]).length;
  $("known").textContent="Đã thuộc "+k+"/"+ALL.length;
  $("pb").style.width=(100*k/ALL.length)+"%";
}
const go=d=>{if(!deck.length)return;i=(i+d+deck.length)%deck.length;flip=false;draw();A("s")};
const mark=v=>{const c=deck[i];if(!c)return;if(v)st[c.n]=1;else delete st[c.n];save();go(1)};
const A=c=>{const e=$("card");e.classList.remove("f","s");void e.offsetWidth;e.classList.add(c)};
$("card").onclick=()=>{flip=!flip;draw();A("f")};
$("next").onclick=()=>go(1);$("prev").onclick=()=>go(-1);
$("ok").onclick=()=>mark(1);$("no").onclick=()=>mark(0);
$("shuf").onclick=()=>build(true);
$("grp").onchange=$("mode").onchange=()=>build(false);
$("rst").onclick=()=>{st={};save();build(false)};
document.onkeydown=e=>{if(!$("qz").hidden)return;if(e.target.tagName==="SELECT")return;
 if(e.key===" "){e.preventDefault();flip=!flip;draw()}
 else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
 else if(e.key==="1")mark(0);else if(e.key==="2")mark(1)};
build(false);

const QD=[{"n": 1, "s": "______ can you succeed.", "o": ["With hard work", "Working hard", "Only with hard work", "Now that you work hard"], "a": 2, "x": "C: \"Only + cụm trạng ngữ\" đứng đầu câu thì đảo ngữ (can you).§A sai: thiếu Only nên không có nghĩa nhấn mạnh/đảo ngữ.§B sai: Working hard không đi với \"can you succeed\" đảo ngữ.§D sai: Now that + S + V là mệnh đề lý do, không tạo cấu trúc đảo \"can you\"."}, {"n": 2, "s": "______ fees were charged for retrieving these beasts, cash that had to be borrowed from traders at the cost of yet further indebtedness.", "o": ["Contemptible", "Exorbitant", "Indispensable", "Requisite"], "a": 1, "x": "B: exorbitant = quá cao, cắt cổ (phí).§A sai: contemptible = đáng khinh.§C sai: indispensable = không thể thiếu.§D sai: requisite = cần thiết, không nói về mức giá."}, {"n": 3, "s": "______ on by her husband, she applied for the job she had always dreamt of having.", "o": ["Begged", "Urged", "Pleaded", "Obliged"], "a": 1, "x": "B: \"Urged on by\" = được thúc giục bởi.§A sai: beg đi với \"sb to V\", không có \"begged on by\".§C sai: plead dùng \"plead with sb\", không đi \"on by\".§D sai: obliged = bắt buộc, không đi với \"on\"."}, {"n": 4, "s": "______ this product malfunctions, be sure to return it to the retailer for a refund or replacement.", "o": ["In the event that", "On condition", "Inasmuch as", "Seeing that"], "a": 0, "x": "A: in the event that = trong trường hợp.§B sai: on condition phải có \"that\" (on condition that).§C sai: inasmuch as = bởi vì (nêu lý do), không phải giả định.§D sai: seeing that = vì rằng, cũng chỉ lý do."}, {"n": 5, "s": "______ with anger, he stormed into the office and demanded to see someone about his case, which had dragged on for nearly three years.", "o": ["Brimming", "Pouring", "Seething", "Stewing"], "a": 2, "x": "C: seething with anger = sôi sục vì giận.§A sai: brimming with đi với niềm vui, tràn đầy (confidence, tears), không hợp \"anger\" ở đây.§B sai: pouring with đi với mưa/mồ hôi.§D sai: stewing thường là âm ỉ một mình (stew in one's juice), không đi \"with anger\" tự nhiên."}, {"n": 6, "s": "______ with being so busy both at work and at home, she became increasingly tired and bad-tempered.", "o": ["How", "Where", "Which", "What"], "a": 3, "x": "D: What with + N/V-ing = vì (nhiều lý do cộng lại).§A, B, C sai: how/where/which không tạo cấu trúc \"with being…\" mang nghĩa nguyên nhân."}, {"n": 7, "s": "______ you to need anything, feel free to call me up.", "o": ["Should", "Unless", "Were", "If"], "a": 0, "x": "A: đảo ngữ điều kiện loại 1 \"Should you need…\".§B sai: Unless mang nghĩa phủ định, không đảo.§C sai: Were + you + to need mới đúng, thiếu \"to\".§D sai: If you to need sai ngữ pháp."}, {"n": 8, "s": "______ your child’s hunger for knowledge with this CD-ROM version of our encyclopedia.", "o": ["Satisfy", "Quench", "Fulfil", "Meet"], "a": 1, "x": "B: quench (thirst/hunger for knowledge) = thỏa cơn khát tri thức.§A sai: satisfy gần nghĩa nhưng với \"hunger for knowledge\" quen dùng quench.§C sai: fulfil đi với ambition, promise.§D sai: meet đi với needs, demands."}, {"n": 9, "s": "______, I must challenge you on that.", "o": ["However convinced the point is", "Though the point sounds convinced", "Convincing as the point sounds", "Despite being convincing"], "a": 2, "x": "C: Adj + as + S + V = dù… (Convincing as the point sounds).§A sai: However + adj chỉ người; convinced là tính từ chỉ người, không nói về \"the point\".§B sai: sounds convinced sai nghĩa (convinced chỉ người).§D sai: chủ ngữ ngầm của \"being convincing\" không khớp với \"I\"."}, {"n": 10, "s": "“______”, as the saying goes. Make the most out of your life while you can, while you’re young and without any big responsibilities.", "o": ["Nothing venture, nothing gain.", "Pride comes before a fall.", "Make hay while the sun shines.", "Prevention is better than cure."], "a": 2, "x": "C: Make hay while the sun shines = tận dụng thời cơ.§A sai: không liều thì không được gì.§B sai: kiêu ngạo ắt sa ngã.§D sai: phòng bệnh hơn chữa bệnh."}, {"n": 11, "s": "“Controlled freedom” is a ______ in terms.", "o": ["contradiction", "contrast", "variance", "divergence"], "a": 0, "x": "A: a contradiction in terms = mâu thuẫn ngay trong cách nói.§B, C, D sai: contrast/variance/divergence không tạo thành thành ngữ này."}, {"n": 12, "s": "“There is no further treatment we can give,” said Dr Jekyll. “We must let the disease take its ______.”", "o": ["course", "end", "term", "way"], "a": 0, "x": "A: take its course = diễn biến tự nhiên.§B sai: take its end không có.§C sai: take its term không có.§D sai: take its way không có."}, {"n": 13, "s": "A copy of the booklet can be obtained ______ free of charge from your nearest chemists.", "o": ["extremely", "entirely", "greatly", "highly"], "a": 1, "x": "B: entirely free of charge = hoàn toàn miễn phí.§A sai: extremely không dùng với cụm tuyệt đối \"free of charge\".§C sai: greatly dùng bổ nghĩa động từ.§D sai: highly đi với tính từ như recommended, unlikely."}, {"n": 14, "s": "A few modifications have been made to ______ the loopholes in the school regulations.", "o": ["screw", "shut", "tie", "plug"], "a": 3, "x": "D: plug the loopholes = bịt kẽ hở.§A sai: screw = vặn vít.§B sai: shut the door, không đi với loopholes.§C sai: tie = buộc."}, {"n": 15, "s": "A lesser-known symptom of this condition is that you will suddenly have panic attacks and ______ cold sweats with little or no warning.", "o": ["come across", "give off", "break into", "switch on"], "a": 2, "x": "C: break into a cold sweat = toát mồ hôi lạnh.§A sai: come across = tình cờ gặp.§B sai: give off = tỏa ra (mùi, nhiệt), không đi với \"cold sweats\".§D sai: switch on = bật."}, {"n": 16, "s": "A politician must be strong enough to withstand the ______ which are constantly directed at him by the media.", "o": ["brickbats", "sob stories", "mishmashes", "tittle-tattles"], "a": 0, "x": "A: brickbats = lời chỉ trích gay gắt.§B sai: sob stories = chuyện sướt mướt.§C sai: mishmashes = mớ hỗn độn.§D sai: tittle-tattles = chuyện tầm phào, không chỉ chỉ trích nhắm vào chính trị gia."}, {"n": 17, "s": "A small ______ of this medicine should be enough to lessen the pain.", "o": ["part", "size", "dose", "ration"], "a": 2, "x": "C: a small dose of medicine = liều thuốc nhỏ.§A sai: part không chuyên dùng cho thuốc.§B sai: size = kích cỡ.§D sai: ration = khẩu phần (thực phẩm)."}, {"n": 18, "s": "A Sunday ______ to the hills is all the holiday I need to feel refreshed and ready to face another week of work.", "o": ["jaunt", "diversion", "recuperation", "itinerary"], "a": 0, "x": "A: jaunt = chuyến đi chơi ngắn.§B sai: diversion = sự giải trí/đường vòng.§C sai: recuperation = sự hồi phục.§D sai: itinerary = lịch trình."}, {"n": 19, "s": "A tsunami is ______ to be one of the most catastrophic natural phenomena.", "o": ["tacked", "streaked", "reckoned", "acquitted"], "a": 2, "x": "C: be reckoned to be = được coi là.§A, B, D sai: tacked/streaked/acquitted không có nghĩa phù hợp (acquitted = tuyên trắng án)."}, {"n": 20, "s": "A young tourist has been declared ______ after he got lost in the mountains last Monday.", "o": ["absent", "deserter", "missing", "vanished"], "a": 2, "x": "C: declared missing = bị tuyên bố mất tích.§A sai: absent = vắng mặt.§B sai: deserter là danh từ (kẻ đào ngũ).§D sai: vanished = biến mất, không dùng \"declared vanished\"."}, {"n": 21, "s": "About two hundred illegal immigrants have been ______ from the country this year.", "o": ["expired", "enforced", "evicted", "expelled"], "a": 3, "x": "D: expelled from the country = bị trục xuất khỏi nước.§A sai: expired = hết hạn.§B sai: enforced = thi hành.§C sai: evicted = đuổi khỏi nhà, đất thuê."}, {"n": 22, "s": "According to a survey ______ by the university, students are spending more time studying online.", "o": ["urged", "carried", "conducted", "executed"], "a": 2, "x": "C: a survey conducted by… = khảo sát do… tiến hành.§A sai: urged = thúc giục.§B sai: carried phải đi với \"out\".§D sai: executed dùng cho kế hoạch/án tử."}, {"n": 23, "s": "Activities in the department store were ______ by animal rights activists protesting against the sale of fur coats.", "o": ["disorientated", "disrupted", "deranged", "disturbed"], "a": 1, "x": "B: disrupted = bị làm gián đoạn.§A sai: disorientated = mất phương hướng (người).§C sai: deranged = loạn trí.§D sai: disturbed = bị làm phiền, nhẹ hơn và không hợp \"activities\"."}, {"n": 24, "s": "After a few seconds, the sugar completely ______ in the water.", "o": ["induced", "designated", "centered", "dissolved"], "a": 3, "x": "D: dissolved in water = tan trong nước.§A, B, C sai: induced/designated/centered không có nghĩa tan."}, {"n": 25, "s": "After a lengthy debate, the spokesman announced the board had ______ a unanimous conclusion.", "o": ["committed", "solved", "compromised", "reached"], "a": 3, "x": "D: reach a conclusion = đi đến kết luận.§A sai: commit a conclusion không có.§B sai: solve dùng với problem.§C sai: compromise là nội động từ, không có tân ngữ này."}, {"n": 26, "s": "After a month, she will ______ the ropes and won’t keep bothering you for help.", "o": ["get", "show", "climb", "learn"], "a": 3, "x": "D: learn the ropes = học việc, nắm cách làm.§A, B, C sai: get/show/climb the ropes không phải thành ngữ."}, {"n": 27, "s": "After a while, we found ourselves questioning the spiritual and philosophical ______ of the American way of life.", "o": ["snagging", "conspiring", "underpinning", "limping"], "a": 2, "x": "C: underpinning = nền tảng (triết lý).§A sai: snagging = vướng.§B sai: conspiring = âm mưu.§D sai: limping = đi khập khiễng."}, {"n": 28, "s": "After his embarrassing comment, a ______ silence descended on the room.", "o": ["mortal", "deathly", "fatal", "lethal"], "a": 1, "x": "B: deathly silence = im lặng chết chóc.§A sai: mortal = có thể chết.§C sai: fatal = gây tử vong.§D sai: lethal = gây chết người, không đi với silence."}, {"n": 29, "s": "After ten hours of fruitless negotiations, he stormed out of the meeting in ______.", "o": ["demolition", "exasperation", "penetration", "castigation"], "a": 1, "x": "B: in exasperation = trong sự bực tức.§A sai: demolition = phá dỡ.§C sai: penetration = sự xuyên qua.§D sai: castigation = sự khiển trách."}, {"n": 30, "s": "After the crash, he was taken to hospital suffering from ______ injuries.", "o": ["manifold", "variable", "diverse", "multiple"], "a": 3, "x": "D: multiple injuries = nhiều vết thương.§A sai: manifold = đa dạng (văn chương), ít dùng với injuries.§B sai: variable = thay đổi.§C sai: diverse = khác loại, không hợp."}, {"n": 31, "s": "After three weeks, the cut on Tom’s hand has still not ______.", "o": ["cured", "joined", "mended", "healed"], "a": 3, "x": "D: heal = (vết thương) lành.§A sai: cure = chữa bệnh.§B sai: join không dùng cho vết cắt.§C sai: mend thường nói đồ vật/xương, vết cắt dùng heal."}, {"n": 32, "s": "After years of working together, the partners found themselves ______ linked.", "o": ["permanently", "indelibly", "perpetually", "inextricably"], "a": 3, "x": "D: inextricably linked = gắn chặt, không thể tách rời.§A sai: permanently không đi với linked ở nghĩa này.§B sai: indelibly = không xóa được (mực, trí nhớ).§C sai: perpetually = liên tục mãi."}, {"n": 33, "s": "Ageing is a natural process that will in time take ______ toll on the body.", "o": ["his", "some", "the", "its"], "a": 3, "x": "D: take its toll on = gây thiệt hại, chủ ngữ Ageing nên dùng its.§A sai: his chỉ nam.§B sai: some toll không có.§C sai: the toll không đi với \"take … on\"."}, {"n": 34, "s": "All the inhabitants in the area have been asked to ______ at home if the storm returns.", "o": ["settle", "dwell", "occupy", "remain"], "a": 3, "x": "D: remain at home = ở nhà.§A sai: settle = định cư.§B sai: dwell phải đi \"in/on\".§C sai: occupy cần tân ngữ trực tiếp."}, {"n": 35, "s": "Although a ______ retina sounds very serious, the operation to repair it only took a short time.", "o": ["dismounted", "disconnected", "decentralised", "detached"], "a": 3, "x": "D: detached retina = bong võng mạc.§A, B, C sai: dismounted/disconnected/decentralised không phải thuật ngữ y khoa này."}, {"n": 36, "s": "Although she was fashionably dressed, the girl didn’t notice the long thread trailing from the ______ of her skirt.", "o": ["border", "cuff", "hem", "lapel"], "a": 2, "x": "C: hem = gấu váy.§A sai: border = đường viền.§B sai: cuff = cổ tay áo.§D sai: lapel = ve áo."}, {"n": 37, "s": "Although the delegate ______ in the committee’s decision, he has never changed his own view ever since.", "o": ["concurred", "consented", "acquiesced", "brokered"], "a": 2, "x": "C: acquiesce in = miễn cưỡng đồng ý (nhưng giữ ý riêng).§A sai: concur đi với \"with sb\", sắc thái đồng tình thật sự.§B sai: consent đi với \"to\".§D sai: brokered = làm trung gian."}, {"n": 38, "s": "Are you doing this English course with a ______ to getting a better job or not?", "o": ["target", "view", "vocation", "intention"], "a": 1, "x": "B: with a view to + V-ing = với mục đích.§A sai: target không đi với \"with a\".§C sai: vocation = nghề.§D sai: phải là \"with the intention of\"."}, {"n": 39, "s": "As a parent, she was ______ of her children’s online activities, monitoring their internet usage to ensure their safety.", "o": ["caring", "frightened", "fussy", "wary"], "a": 3, "x": "D: wary of = cảnh giác, dè chừng.§A sai: caring thường đi \"caring for/about\".§B sai: frightened of = sợ, không hợp ngữ cảnh giám sát.§C sai: fussy = khó tính."}, {"n": 40, "s": "As soon as the bomb was discovered by one of the cleaning staff, the police had the area ______ off and no one was allowed within two blocks of the cafe.", "o": ["secluded", "cordoned", "segregated", "isolated"], "a": 1, "x": "B: cordon off = phong tỏa.§A sai: secluded = hẻo lánh.§C sai: segregated = tách biệt (chủng tộc).§D sai: isolated off không đi với \"off\"."}, {"n": 41, "s": "As soon as the storm ______, the ships will be allowed to set sail.", "o": ["abets", "abates", "forbids", "incites"], "a": 1, "m": "abates: dịu đi, nguôi (bão)"}, {"n": 42, "s": "As you are no doubt ______ aware, your lies have shown you to be an untrustworthy employee and we will have to let you go.", "o": ["steadily", "painfully", "apparently", "sharply"], "a": 1, "m": "painfully: painfully aware: nhận thức một cách đau đớn"}, {"n": 43, "s": "At 85 she says she’s unlikely to realize her ______ ambition of learning to fly.", "o": ["resounding", "longing", "lifelong", "overall"], "a": 2, "m": "lifelong: suốt đời"}, {"n": 44, "s": "At the ______ moment, he backed out.", "o": ["insignificant", "meaningful", "crucial", "trifling"], "a": 2, "m": "crucial: then quyết, quan trọng nhất"}, {"n": 45, "s": "Because of an unfortunate ______ the complimentary tickets to the exhibition were not sent out until the day the exhibition closed.", "o": ["anachronism", "idiosyncrasy", "obituary", "oversight"], "a": 3, "m": "oversight: sự sơ suất"}, {"n": 46, "s": "Because of the ice, drivers found their cars ______ on the road.", "o": ["squealing", "slipping", "squeaking", "skidding"], "a": 3, "m": "skidding: trượt bánh (xe)"}, {"n": 47, "s": "Before we finish tonight, I would like to ______ the happy couple and wish them all the best for the future.", "o": ["screen", "log", "toast", "head"], "a": 2, "m": "toast: nâng ly chúc mừng"}, {"n": 48, "s": "Being alone in the house all day looking after three young children is enough to make anyone’s patience wear ______.", "o": ["thin", "out", "down", "slim"], "a": 0, "m": "thin: wear thin: cạn dần (kiên nhẫn)"}, {"n": 49, "s": "Blackouts caused by sunspot activity made communication difficult and sometimes impossible, resulting in a ______ of delayed traffic when the blackout ended.", "o": ["backlog", "heyday", "plaque", "quandary"], "a": 0, "m": "backlog: đống việc tồn đọng"}, {"n": 50, "s": "Brian wasn’t really interested in art, so he gave each painting no more than a ______ glance.", "o": ["cursory", "heinous", "indigenous", "petty"], "a": 0, "m": "cursory: qua loa, vội vàng"}, {"n": 51, "s": "By a(n) ______, the team leader did not save the final version of the slides onto the portable drive and we had to make do with the substandard one on the presentation day.", "o": ["blunder", "oversight", "gaffe", "slip"], "a": 1, "m": "oversight: sự sơ suất (by an oversight)"}, {"n": 52, "s": "By cutting the cost of staff training, the company has ______ of destruction.", "o": ["pollinated the flowers", "sowed the seeds", "reaped the fruits", "shed the leaves"], "a": 1, "m": "sowed the seeds: gieo mầm (của sự hủy hoại)"}, {"n": 53, "s": "By the time they ______ at the concert, the tickets were sold out.", "o": ["got through", "filled in", "applied to", "turned up"], "a": 3, "m": "turned up: xuất hiện, đến"}, {"n": 54, "s": "Capital punishment was done ______ in Britain nearly half a century ago.", "o": ["off by", "away with", "over from", "out for"], "a": 1, "m": "away with: do away with: bãi bỏ, loại bỏ"}, {"n": 55, "s": "Children, stop ______ and make a decision and then we can go!", "o": ["dithering", "loitering", "detaining", "faltering"], "a": 0, "m": "dithering: do dự, lưỡng lự"}, {"n": 56, "s": "Companies run by ______ business people wouldn’t be spending millions of dollars on that project if it didn’t work.", "o": ["heavy-footed", "single-breasted", "light-hearted", "hard-nosed"], "a": 3, "m": "hard-nosed: cứng rắn, thực dụng"}, {"n": 57, "s": "Complete the form as ______ in the notes below.", "o": ["insisted", "specified", "implied", "devised"], "a": 1, "m": "specified: được chỉ rõ, quy định"}, {"n": 58, "s": "Could you lend me some money to ______ me over to the end of the month?", "o": ["hand", "make", "get", "tide"], "a": 3, "m": "tide: tide sb over: giúp ai vượt qua giai đoạn khó"}, {"n": 59, "s": "Could you possibly ______ me at the next committee meeting?", "o": ["stand in for", "make up for", "go back on", "keep in with"], "a": 0, "m": "stand in for: thay thế (tạm thời)"}, {"n": 60, "s": "Despite being in the career of singing for the last ten years, he has not been able to earn fame on account of his ______ from others and using them as his own.", "o": ["adaptation", "pantomime", "plagiarism", "piracy"], "a": 2, "m": "plagiarism: đạo văn"}, {"n": 61, "s": "Despite the exhaustive media scrutiny, the charity’s financial records were found to be as clean as a ______.", "o": ["fiddle", "whistle", "breeze", "fibre"], "a": 1, "m": "whistle: as clean as a whistle: sạch sẽ, trong sạch"}, {"n": 62, "s": "Despite the scandal, the leader emerged with his reputation ______.", "o": ["uncontaminated", "untarnished", "unfettered", "unimpaired"], "a": 1, "m": "untarnished: không bị hoen ố"}, {"n": 63, "s": "Difficult assignments should not be ______ to the new assistant because he is not dependable.", "o": ["disseminated", "conspired", "delegated", "relegated"], "a": 2, "m": "delegated: ủy quyền, giao phó"}, {"n": 64, "s": "Do sit down, ______? Feel free to make your suggestions.", "o": ["will you", "don’t you", "do you", "can’t you"], "a": 0, "m": "will you: Do sit down, will you? (câu hỏi đuôi sau mệnh lệnh)"}, {"n": 65, "s": "Do you have even a ______ interest in learning to cook?", "o": ["moving", "going", "fleeting", "passing"], "a": 3, "m": "passing: passing interest: sự quan tâm thoáng qua"}, {"n": 66, "s": "Do you think they are going to ______ any pressure on us to pay the damages for the broken gate?", "o": ["administer", "exert", "implement", "deploy"], "a": 1, "m": "exert: exert pressure on: gây áp lực lên"}, {"n": 67, "s": "Do you think this kind of meat ______ itself to stewing?", "o": ["allows", "gives", "offers", "lends"], "a": 3, "m": "lends: lend itself to: phù hợp với"}, {"n": 68, "s": "Don’t be ______ to your elders.", "o": ["affable", "consistent", "impertinent", "respectable"], "a": 2, "m": "impertinent: xấc xược, láo"}, {"n": 69, "s": "Don’t forget to leave your ______ address in case we have to send your function qHome(){$("qbox").innerHTML='<h2>Kiểm tra ngẫu nhiên 20 câu</h2><label for="rg" style="color:var(--mut)">Chọn khoảng câu muốn kiểm tra</label><select id="rg" style="width:100%;margin:8px 0">'+RG.map((r,i)=>'<option value="'+i+'">Câu '+r[0]+' – '+r[1]+'</option>').join("")+'</select><p style="color:var(--mut);font-size:.88rem;line-height:1.5">Giải thích chi tiết vì sao các đáp án còn lại sai hiện có cho câu 1–40; các câu khác hiển thị đáp án đúng và nghĩa.</p><button class="go" id="st">Bắt đầu</button>';$("st").onclick=qStart}
function qShow(){
  if(qi>=qs.length){$("qbox").innerHTML='<div class="num">Kết quả</div><div class="big">'+sc+'/'+qs.length+'</div>'+(wr.length?'<div class="ex"><b>Câu làm sai:</b>'+wr.map(d=>'<div>Câu '+d.n+': '+esc(d.o[d.a])+'</div>').join('')+'</div>':'<p style="text-align:center">Tuyệt đối!</p>')+'<button class="go" id="again">Làm đề mới (cùng khoảng)</button><button class="go" id="chg" style="background:var(--card);color:var(--ink);border:2px solid var(--bd)">Đổi khoảng câu</button>';$("again").onclick=qStart;$("chg").onclick=qHome;return}
  const d=qs[qi];lk=false;
  $("qbox").innerHTML='<div class="num">Câu '+(qi+1)+'/'+qs.length+' · (số '+d.n+' trong đề)</div><h2>'+esc(d.s)+'</h2>'+d.o.map((o,i)=>'<button class="opt" data-i="'+i+'"><b>'+"ABCD"[i]+'.</b> '+esc(o)+'</button>').join('')+'<div class="ex" id="ex"></div>';
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(lk)return;lk=true;const i=+b.dataset.i,bs=document.querySelectorAll(".opt");
    bs[d.a].classList.add("ok");if(i===d.a)sc++;else{b.classList.add("no");wr.push(d)}
    $("ex").innerHTML=(d.x?d.x.split("§"):["Đáp án đúng "+"ABCD"[d.a]+" – "+d.m,"Câu này chưa có giải thích chi tiết cho các đáp án sai."]).map((t,k)=>'<div class="'+(k?(t.startsWith("Câu này")?"n":""):"g")+'">'+esc(t)+'</div>').join('')+'<button class="go" id="nx">'+(qi+1<qs.length?'Câu tiếp':'Xem kết quả')+'</button>';
    $("nx").onclick=()=>{qi++;qShow()};$("nx").scrollIntoView({block:"nearest",behavior:"smooth"})})}
$("t1").onclick=()=>{$("fc").hidden=false;$("qz").hidden=true;$("t1").className="on";$("t2").className=""};
$("t2").onclick=()=>{$("fc").hidden=true;$("qz").hidden=false;$("t2").className="on";$("t1").className="";if(!qs.length)qHome()};
</script></body></html>
